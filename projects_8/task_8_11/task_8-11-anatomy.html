<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анатомия CSS</title>
    <style>
        /* Стили для всей страницы */
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            color: #222;
            margin: 20px;
        }

        /*
           Заголовки.
           h1 главный, h2 поменьше
        */
        h1 {
            color: #2e7d32;
            font-size: 32px;
            text-align: center;
        }

        h2 {
            color: #1565c0;
            font-size: 24px;
            border-bottom: 1px solid #ccc;
        }

        p {
            font-size: 16px;
            line-height: 1.5; /* расстояние между строками */
            color: #444;
        }

        a {
            color: #d32f2f;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Как устроен CSS</h1>

    <h2>Правило</h2>
    <p>Правило состоит из селектора и блока объявлений в фигурных скобках.</p>
    <p>Каждое объявление — это свойство и значение через двоеточие.</p>

    <h2>Где почитать</h2>
    <p>Подробнее про CSS можно прочитать на
        <a href="https://developer.mozilla.org/ru/docs/Web/CSS">MDN</a>.</p>
</body>
</html>
