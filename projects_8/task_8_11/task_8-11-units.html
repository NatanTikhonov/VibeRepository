<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Единицы измерения</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 16px; /* попробуй поменять на 20px */
        }

        .box {
            border: 1px solid #4caf50;
            padding: 12px;
            margin-bottom: 10px;
            background: #fafaf7;
        }

        .size-px { width: 200px; }
        .size-em { width: 15em; }
        .size-rem { width: 12rem; }
        .size-percent { width: 50%; }
        .size-vw { width: 30vw; }
    </style>
</head>
<body>
    <div class="box size-px">Блок 1 (200px)</div>
    <div class="box size-em">Блок 2 (15em)</div>
    <div class="box size-rem">Блок 3 (12rem)</div>
    <div class="box size-percent">Блок 4 (50%)</div>
    <div class="box size-vw">Блок 5 (30vw)</div>
</body>
</html>
