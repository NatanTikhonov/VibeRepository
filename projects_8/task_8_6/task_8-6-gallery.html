<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой день</title>
</head>
<body>
    <h1>Фотогалерея «Мой день»</h1>

    <figure>
        <img src="images/01-morning.jpg" alt="Утро, восход солнца" width="800" height="533" loading="eager">
        <figcaption>Утро: проснулся и посмотрел в окно.</figcaption>
    </figure>

    <figure>
        <img src="images/02-breakfast.jpg" alt="Завтрак" width="800" height="533" loading="lazy">
        <figcaption>Завтрак перед учёбой.</figcaption>
    </figure>

    <figure>
        <a href="images/03-university.jpg" target="_blank">
            <img src="images/03-university.jpg" alt="Университет" width="800" height="533" loading="lazy">
        </a>
        <figcaption>Пары в университете (нажми на фото, чтобы открыть в полном размере).</figcaption>
    </figure>

    <figure>
        <img src="images/04-lunch.jpg" alt="Обед" width="800" height="533" loading="lazy">
        <figcaption>Обед в столовой.</figcaption>
    </figure>

    <figure>
        <img src="images/05-homework.jpg" alt="Домашнее задание" width="800" height="533" loading="lazy">
        <figcaption>Делаю домашку по HTML.</figcaption>
    </figure>

    <figure>
        <img src="images/06-evening.jpg" alt="Вечер" width="800" height="533" loading="lazy">
        <figcaption>Вечер, можно отдохнуть.</figcaption>
    </figure>
</body>
</html>
